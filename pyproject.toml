[project]
name = "vedic-astro-agent"
version = "5.0.0"
description = "PyJHora -> AI Vedic Astrologer: 2-step pipeline (compute_chart.py + astrologer prompt)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "GS-Professional" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_coverage.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
