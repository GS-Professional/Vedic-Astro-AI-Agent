name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential swig git

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyJHora dev release
        run: bash install_pyjhora_dev.sh

      - name: Download Swiss Ephemeris
        run: python setup_ephemeris.py

      - name: Test
        run: python test_coverage.py
