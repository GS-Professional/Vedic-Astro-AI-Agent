name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # pyswisseph ships source-only wheels; PyJHora's drik uses timezonefinder etc.
      - name: Install system build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential swig

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Download Swiss Ephemeris
        run: |
          ./setup_ephe.sh ./ephe
          echo "VEDIC_EPHE_DIR=$PWD/ephe" >> "$GITHUB_ENV"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q
